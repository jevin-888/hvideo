<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>写序列号 · HVIDEO</title>
    <link rel="stylesheet" href="factory-serial.css">
    <script type="module" src="modules/pages/factorySerial.js"></script>
    <link rel="stylesheet" href="shared/i18n.css?v=20261102">
    <script defer src="shared/i18n-catalog.js?v=20261102"></script>
    <script defer src="shared/i18n.js?v=20261102"></script>
</head>
<body>
    <main>
        <label class="player-language"><span aria-hidden="true">🌐</span><select data-player-language aria-label="语言"><option value="zh" translate="no">中文</option><option value="en">English</option><option value="id">Bahasa Indonesia</option><option value="vi">Tiếng Việt</option><option value="th">ไทย</option></select></label>
        <h1>写序列号</h1>
        <dl>
            <div><dt>设备 IP</dt><dd id="target-ip"></dd></div>
            <div><dt>当前序列号</dt><dd id="current-serial">—</dd></div>
            <div id="stored-row" hidden><dt>待生效序列号</dt><dd id="stored-serial">—</dd></div>
        </dl>
        <form id="serial-form">
            <label for="new-serial">新的序列号</label>
            <input id="new-serial" name="serial" required maxlength="14" pattern="[A-Za-z][A-Za-z0-9]{0,13}" placeholder="例如 H202609161001" autocomplete="off" spellcheck="false" disabled>
            <p class="hint">1–14 位字母或数字，字母开头。</p>
            <p class="notice">写号成功后，设备将在 2 秒后自动重启。</p>
            <div class="actions"><button id="reload-serial" type="button">重新读取</button><button id="write-serial" class="primary" type="submit" disabled>写号并重启</button></div>
        </form>
        <p id="serial-status" role="status" aria-live="polite">正在连接设备…</p>
    </main>
</body>
</html>
